
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Code validation and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planner_user
          POSTGRES_PASSWORD: planner_password
          POSTGRES_DB: asignaturas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner_user -d asignaturas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASIGNATURAS_DATABASE_URL: postgresql+psycopg://planner_user:planner_password@localhost:5432/asignaturas_test
      TEST_ASIGNATURAS_DATABASE_URL: postgresql+psycopg://planner_user:planner_password@localhost:5432/asignaturas_test
      JWT_SECRET_KEY: clave_secreta_exclusiva_para_pruebas_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r usuarios/requirements.txt
          pip install -r asignaturas_tareas/requirements.txt
          pip install -r planificacion/requirements.txt

      - name: Check code with Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v

      - name: Check Dockerfiles with Hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 < usuarios/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < asignaturas_tareas/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < planificacion/Dockerfile

      - name: Build Docker images
        run: |
          docker build -t planificador-usuarios:ci ./usuarios
          docker build -t planificador-asignaturas:ci ./asignaturas_tareas
          docker build -t planificador-planificacion:ci ./planificacion

  publish:
    name: Publish images to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: usuarios
            image: usuarios
            context: ./usuarios
          - service: asignaturas_tareas
            image: asignaturas-tareas
            context: ./asignaturas_tareas
          - service: planificacion
            image: planificacion
            context: ./planificacion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
