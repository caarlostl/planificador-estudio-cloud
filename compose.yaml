
services:
  db:
    image: postgres:17-alpine
    container_name: planificador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  usuarios:
    build: ./usuarios
    container_name: planificador-usuarios
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      USUARIOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/usuarios_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices
      - database

  asignaturas_tareas:
    build: ./asignaturas_tareas
    container_name: planificador-asignaturas
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ASIGNATURAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/asignaturas_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices
      - database

  planificacion:
    build: ./planificacion
    container_name: planificador-planificacion
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PLANIFICACION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/planificacion_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices
      - database

volumes:
  postgres_data:

networks:
  microservices:
    driver: bridge
  database:
    driver: bridge